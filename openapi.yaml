  /transactions/{transactionId}:
    get:
      summary: Read a stored transaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stored transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionReadEnvelope'
    patch:
      summary: Manually reconcile a stored transaction
      description: Updates only local proxy state after external reconciliation; it does not send a terminal request. At least one of `status`, `amount`, or `tip` is required. When a positive tip is supplied, `totalAmount` is derived from amount plus tip rather than being directly patchable. A conclusive `status` clears any cached recovery cooldown and transaction lock so a new card operation can start immediately. All other transaction fields remain terminal-controlled and cannot be patched.
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionPatchRequest'
      responses:
        '200':
          description: Updated local transaction state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionReadEnvelope'
              examples:
                reconciled:
                  value:
                    message: Transaction reconciled successfully.
                    transaction:
                      transactionId: trx_123
                      amount: '12.50'
                      totalAmount: '14.50'
                      tip: '2.00'
                      currency: CHF
                      terminalAlias: q30-1
                      status: succeeded
                    requestId: req_123
        '400':
          description: Empty body, unsupported field, invalid amount, or status not allowed for this transaction type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Transaction not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /transactions/{transactionId}/receipts:
    get:
      summary: Read stored receipts for a transaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
